name: Library Scrape & Notify

on:
  schedule:
    # 10:17 Taiwan time (UTC+8) = 02:17 UTC
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode: daily, summary, borrowed, reservations, return, hours, renew'
        required: false
        default: 'daily'
      source:
        description: 'Execution source: manual or line'
        required: false
        default: 'manual'

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper and notifier
        env:
          TZ: Asia/Taipei
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || github.event.inputs.source || 'manual' }}
          ACCOUNT1_LABEL: ${{ secrets.ACCOUNT1_LABEL }}
          ACCOUNT1_CARD: ${{ secrets.ACCOUNT1_CARD }}
          ACCOUNT1_PASSWORD: ${{ secrets.ACCOUNT1_PASSWORD }}
          ACCOUNT2_LABEL: ${{ secrets.ACCOUNT2_LABEL }}
          ACCOUNT2_CARD: ${{ secrets.ACCOUNT2_CARD }}
          ACCOUNT2_PASSWORD: ${{ secrets.ACCOUNT2_PASSWORD }}
          ACCOUNT3_LABEL: ${{ secrets.ACCOUNT3_LABEL }}
          ACCOUNT3_CARD: ${{ secrets.ACCOUNT3_CARD }}
          ACCOUNT3_PASSWORD: ${{ secrets.ACCOUNT3_PASSWORD }}
          ACCOUNT4_LABEL: ${{ secrets.ACCOUNT4_LABEL }}
          ACCOUNT4_CARD: ${{ secrets.ACCOUNT4_CARD }}
          ACCOUNT4_PASSWORD: ${{ secrets.ACCOUNT4_PASSWORD }}
          ACCOUNT5_LABEL: ${{ secrets.ACCOUNT5_LABEL }}
          ACCOUNT5_CARD: ${{ secrets.ACCOUNT5_CARD }}
          ACCOUNT5_PASSWORD: ${{ secrets.ACCOUNT5_PASSWORD }}
          ACCOUNT6_LABEL: ${{ secrets.ACCOUNT6_LABEL }}
          ACCOUNT6_CARD: ${{ secrets.ACCOUNT6_CARD }}
          ACCOUNT6_PASSWORD: ${{ secrets.ACCOUNT6_PASSWORD }}
          ACCOUNT7_LABEL: ${{ secrets.ACCOUNT7_LABEL }}
          ACCOUNT7_CARD: ${{ secrets.ACCOUNT7_CARD }}
          ACCOUNT7_PASSWORD: ${{ secrets.ACCOUNT7_PASSWORD }}
          ACCOUNT8_LABEL: ${{ secrets.ACCOUNT8_LABEL }}
          ACCOUNT8_CARD: ${{ secrets.ACCOUNT8_CARD }}
          ACCOUNT8_PASSWORD: ${{ secrets.ACCOUNT8_PASSWORD }}
          ACCOUNT9_LABEL: ${{ secrets.ACCOUNT9_LABEL }}
          ACCOUNT9_CARD: ${{ secrets.ACCOUNT9_CARD }}
          ACCOUNT9_PASSWORD: ${{ secrets.ACCOUNT9_PASSWORD }}
          ACCOUNT10_LABEL: ${{ secrets.ACCOUNT10_LABEL }}
          ACCOUNT10_CARD: ${{ secrets.ACCOUNT10_CARD }}
          ACCOUNT10_PASSWORD: ${{ secrets.ACCOUNT10_PASSWORD }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node src/run.js
